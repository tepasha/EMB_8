## IDF Component Manager manifest — belongs in the main/ component dir.
## Schematik maps src/ → main/, so this file is in the right place.
## The component manager downloads dependencies automatically at build time.

dependencies:
  idf: ">=5.1.0"

  ## u8g2-hal-esp-idf by mkfrey — ESP-IDF v5.x HAL for the U8g2 library.
  ## Provides: u8g2_esp32_hal.h, u8g2_esp32_i2c_byte_cb,
  ##           u8g2_esp32_gpio_and_delay_cb, u8g2_esp32_hal_init()
  ## Source:   https://github.com/mkfrey/u8g2-hal-esp-idf
  mkfrey/u8g2_hal_esp_idf:
    git: "https://github.com/mkfrey/u8g2-hal-esp-idf.git"
    version: "*"
